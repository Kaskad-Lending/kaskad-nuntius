[package]
name = "keyex"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Off-chain EIP-712 approval verifier for the Pontifex keyex boot rules."

[dependencies]
alloy-sol-types = "1"
alloy-primitives = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
# HKDF-SHA256 child-key derivation (RFC 5869). sha2 0.10 matches k256's own.
hkdf = "0.12"
sha2 = "0.10"
eyre = "0.6"
# Wire types for the VSOCK API + coded refusal enums (serde-tagged, not strings).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nitro-common = { path = "../nitro-common" }

# RA-TLS transport (slice 3). rustls pinned EXACTLY to the version the live
# Igra oracle links (feature-OFF closure resolves the same lock) so a price-only
# rebuild keeps PCR0 0x2e66fc4f; ring backend only (no aws-lc-rs in the
# workspace — default features would pull it, so opt out).
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
# Ephemeral self-signed P-256 certs; ring backend, no aws-lc-rs.
rcgen = "0.14"
# Zeroize the transferable secp256k1 key on every refusal/error path.
zeroize = "1"
# Peer TLS SPKI extraction from the presented cert (workspace-pinned parser).
x509-cert = "0.2"
# RngCore/CryptoRng trait for the injected nonce CSPRNG (NsmRng in the enclave).
rand_core = "0.6"
# Async framing over the TLS stream.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "sync"] }
# Boot-driver progress logs (driver.rs); warn-level, logs peer index only (R-8).
tracing = "0.1"

[dev-dependencies]
hex = "0.4"
# CSPRNG for nonce generation in tests (the enclave uses nitro-common NsmRng).
rand = "0.8"
