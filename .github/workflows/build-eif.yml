name: Build Keyex EIFs

# Builds both keyex enclave images (oracle CID 16, pontifex CID 17) on the
# us-east-1 Nitro builder via host/build-eif.sh over SSM, publishes each EIF as
# eif/<sha384>.eif (plus the host bundle) to the release bucket and every
# regional mirror in EIF_MIRRORS, and reports its pin (sha384 + PCR0). Nothing
# is signed and nothing boots from this run: a host boots an image only after its
# pin lands in infra/live/eif-release.json and terraform applies it. No ASG refresh here.

on:
  # Deliberate release builds only. Pushing an `eif-v*` tag runs this workflow
  # from the tagged commit's tree and freezes that commit's PCR0 — a tag push
  # needs no default-branch registration, so the keyex stack builds on its own
  # branch without a main merge (parallel infra, live oracle untouched).
  # workflow_dispatch is kept for use once this file reaches the default branch.
  workflow_dispatch:
  push:
    tags:
      - "eif-v*"

permissions:
  id-token: write # OIDC
  contents: read

env:
  ACCOUNT_ID: "095931689333"
  AWS_REGION: us-east-1
  NAME_PREFIX: kaskad-nitro-us

jobs:
  build:
    name: Build + publish EIFs
    runs-on: ubuntu-latest
    outputs:
      oracle_sha384: ${{ steps.pcrs.outputs.oracle_sha384 }}
      oracle_pcr0: ${{ steps.pcrs.outputs.oracle_pcr0 }}
      oracle_pcr1: ${{ steps.pcrs.outputs.oracle_pcr1 }}
      oracle_pcr2: ${{ steps.pcrs.outputs.oracle_pcr2 }}
      pontifex_sha384: ${{ steps.pcrs.outputs.pontifex_sha384 }}
      pontifex_pcr0: ${{ steps.pcrs.outputs.pontifex_pcr0 }}
      pontifex_pcr1: ${{ steps.pcrs.outputs.pontifex_pcr1 }}
      pontifex_pcr2: ${{ steps.pcrs.outputs.pontifex_pcr2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reject developer-absolute paths in tracked sources
        # A fixture read from a workstation home directory passes only there.
        run: |
          set -euo pipefail
          if git grep -n -E "/(home|Users)/" -- . ; then
            echo "tracked source references a developer-absolute path" >&2
            exit 1
          fi

      - name: Test host bootstrap and publication gates
        run: python3 -m unittest discover -s host -p 'test_*.py' -v

      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust release sources
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --features keyex_oracle -- -D warnings
          cargo test --locked --workspace --features keyex_oracle
          cargo test --locked -p kaskad-oracle --no-default-features

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.3

      - name: Test the pinned attestation verifier
        run: forge test --root contracts

      - name: Resolve stack config
        run: |
          set -euo pipefail
          {
            echo "EIF_BUCKET=${NAME_PREFIX}-eif"
            # Each regional fleet's boot bucket (bucket@region); see eif_mirror_buckets.
            echo "EIF_MIRRORS=kaskad-nitro-eu-eif@eu-west-1"
            echo "OIDC_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${NAME_PREFIX}-github-ci"
            echo "BUILDER_TAG=${NAME_PREFIX}-builder"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start builder instance
        id: builder
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${BUILDER_TAG}" \
                      "Name=instance-state-name,Values=running,stopped,stopping,pending" \
            --query "Reservations[].Instances[0].InstanceId" --output text)
          [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] || { echo "no builder found for tag ${BUILDER_TAG}" >&2; exit 1; }
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[].Instances[0].State.Name" --output text)
          echo "Builder $INSTANCE_ID state: $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          fi
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Wait for SSM agent
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # -e off around the pipeline so a transient miss does not kill the loop.
            set +e
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.builder.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null)
            set -e
            if [ "$STATUS" = "Online" ]; then echo "SSM online"; exit 0; fi
            echo "waiting for SSM... ($i/60)"; sleep 10
          done
          echo "SSM agent timeout" >&2; exit 1

      - name: Zip source and upload to S3
        run: |
          set -euo pipefail
          zip -rq source.zip . -x "*.git*" "target/*" "infra/.terraform/*" \
            "*.tfstate" "*.tfstate.*" "*.tfvars" "*.pem" "*.key" ".env*"
          aws s3 cp source.zip "s3://${EIF_BUCKET}/builds/${{ github.sha }}/source.zip"

      - name: Build both EIFs via SSM
        # Drives host/build-eif.sh on the builder: docker build (2-stage musl,
        # digest-pinned) -> nitro-cli build-enclave -> PCR extract -> S3 publish.
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.builder.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -euxo pipefail",
              "export COMMIT=${{ github.sha }}",
              "export EIF_BUCKET='"${EIF_BUCKET}"'",
              "export AWS_REGION='"${AWS_REGION}"'",
              "sudo dnf install -y aws-nitro-enclaves-cli aws-nitro-enclaves-cli-devel awscli docker git jq unzip",
              "sudo systemctl start docker",
              "if ! swapon --show | grep -q /swapfile; then sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile; fi",
              "rm -rf /tmp/build && mkdir -p /tmp/build",
              "aws s3 cp s3://'"${EIF_BUCKET}"'/builds/${{ github.sha }}/source.zip /tmp/source.zip",
              "unzip -q /tmp/source.zip -d /tmp/build/",
              "chmod +x /tmp/build/host/build-eif.sh",
              "cd /tmp/build && COMMIT=${{ github.sha }} EIF_BUCKET='"${EIF_BUCKET}"' EIF_MIRRORS='"${EIF_MIRRORS}"' AWS_REGION='"${AWS_REGION}"' host/build-eif.sh"
            ]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          while :; do
            set +e
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ steps.builder.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null)
            set -e
            [ -z "$STATUS" ] && STATUS=Pending
            echo "build status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "${{ steps.builder.outputs.instance_id }}" \
                  --query "{Out:StandardOutputContent,Err:StandardErrorContent}" --output json
                echo "SSM build failed: $STATUS" >&2; exit 1;;
            esac
            sleep 30
          done
        timeout-minutes: 60

      - name: Stop builder instance
        if: always()
        run: |
          set -euo pipefail
          [ -n "${{ steps.builder.outputs.instance_id }}" ] && \
            aws ec2 stop-instances --instance-ids "${{ steps.builder.outputs.instance_id }}" || true

      - name: Collect PCR measurements
        id: pcrs
        run: |
          set -euo pipefail
          mkdir -p pcrs
          for name in oracle pontifex; do
            aws s3 cp "s3://${EIF_BUCKET}/staging/${{ github.sha }}/${name}.pcrs.json" "pcrs/${name}.pcrs.json"
            aws s3 cp "s3://${EIF_BUCKET}/staging/${{ github.sha }}/${name}.pin.json" "pcrs/${name}.pin.json"
            for k in sha384 PCR0 PCR1 PCR2; do
              v=$(jq -r ".${k}" "pcrs/${name}.pcrs.json")
              [[ "$v" =~ ^[0-9a-f]{96}$ ]] || { echo "bad ${name} ${k}: $v" >&2; exit 1; }
              echo "${name}_${k,,}=${v}" >> "$GITHUB_OUTPUT"
            done
          done

      - name: Upload PCR artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyex-pcrs
          path: pcrs/*.json

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "## Keyex EIF measurements"
            echo "Commit: \`${{ github.sha }}\`  Bucket: \`${EIF_BUCKET}\`  Mirrors: \`${EIF_MIRRORS}\`"
            echo ""
            echo "| image | field | value |"
            echo "|---|---|---|"
            for name in oracle pontifex; do
              for k in sha384 PCR0 PCR1 PCR2; do
                v=$(jq -r ".${k}" "pcrs/${name}.pcrs.json")
                echo "| ${name} | ${k} | \`${v}\` |"
              done
            done
            echo ""
            echo "Pins for \`infra/live/eif-release.json\`:"
            echo '```json'
            jq -s '{oracle: .[0], pontifex: .[1]}' pcrs/oracle.pin.json pcrs/pontifex.pin.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
