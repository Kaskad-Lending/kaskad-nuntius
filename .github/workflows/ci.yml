name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Rust ──────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --all-targets --features keyex_oracle -- -D warnings

      - name: Rust tests
        run: |
          cargo test --workspace
          cargo test --features keyex_oracle

  # Own job: the host-side Python has no Rust dependency, and gating it behind
  # `cargo fmt` means a formatting drift hides rate-limiter regressions.
  pull-api:
    name: Pull API (host-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull API tests
        run: python3 -m unittest enclave.test_pull_api -v
