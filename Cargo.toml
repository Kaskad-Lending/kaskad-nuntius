[package]
name = "kaskad-oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for CEX APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls-webpki-roots", "http2"] }
# EVM types & signing 
alloy-primitives = "1"
alloy-sol-types = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling & logging
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Time
chrono = "0.4"

# Async trait support
async-trait = "0.1"

# Hex encoding
hex = "0.4"

# Random key generation (dev)
rand = "0.8"

# Scrub private key seed material after use
zeroize = "1"

# Base64 — used by KMS sealing for AWS API request/response payloads
base64 = "0.22"

# RSA-2048 ephemeral keypair for KMS attestation Recipient mode
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }

# CMS EnvelopedData parsing — KMS returns the Recipient-mode plaintext
# as a CMS `EnvelopedData` (RFC 5652) in `CiphertextForRecipient`. AWS
# KMS emits it as BER with indefinite-length segments, which strict-DER
# parsers (RustCrypto `der`) reject; `bcder` is a BER-native decoder
# (NLnetLabs, production-grade in RPKI) that handles indefinite length.
bcder = "0.7.6"

# AES-256-CBC: the CMS content-encryption layer wrapping the sealed key.
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }

# SigV4 signer + Identity wrapper for KMS / S3 calls inside the
# enclave. We use just the signer (not the full AWS SDK), so HTTP
# transport stays on our existing `reqwest` client routed through
# the VSOCK→TCP CONNECT proxy.
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"

# Used by sealing.rs to construct AWS API requests for SigV4 signing
http = "1"

# Deps added for the WS-streaming collector layer (collectors/, cob.rs).
# rustls + no system CA bundle (Nitro Enclave has none).
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# SOCKS5 dialler for the WS leg; tungstenite has no env-proxy support.
tokio-socks = "0.5"
futures = "0.3"
ordered-float = "4"
num-integer = "0.1"
ulid = "1"
flate2 = "1"
prost = "0.12"
once_cell = "1"
url = "2"

[build-dependencies]
protoc-bin-vendored = "3"
prost-build = "0.12"

# VSOCK support (Linux only, for Nitro Enclave)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
aws-nitro-enclaves-nsm-api = "0.4"
# `vsock` crate gives us a `VsockStream` API for talking to the host's
# IAM-credential proxy on AF_VSOCK. cfg-gated because the kernel
# constants are Linux-only.
vsock = "0.5"


[dev-dependencies]
tokio-test = "0.4"
